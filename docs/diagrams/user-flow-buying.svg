<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="900" xmlns="http://www.w3.org/2000/svg">
  <!-- White Background -->
  <rect width="700" height="900" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="350" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#000">
    User Flow: Item Purchase Journey
  </text>
  
  <!-- Start -->
  <ellipse cx="350" cy="70" rx="60" ry="30" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="350" y="78" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">START</text>
  
  <!-- Arrow -->
  <line x1="350" y1="100" x2="350" y2="130" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 1: Browse Items -->
  <rect x="250" y="130" width="200" height="60" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="350" y="155" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">Browse Items</text>
  <text x="350" y="172" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">View item listings</text>
  <text x="350" y="185" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Apply filters/search</text>
  
  <!-- Arrow -->
  <line x1="350" y1="190" x2="350" y2="220" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Decision: Found Item? -->
  <path d="M 350 220 L 450 270 L 350 320 L 250 270 Z" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="350" y="265" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000">Found</text>
  <text x="350" y="280" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000">Item?</text>
  
  <!-- No - Loop back -->
  <line x1="250" y1="270" x2="150" y2="270" stroke="#000" stroke-width="2"/>
  <line x1="150" y1="270" x2="150" y2="160" stroke="#000" stroke-width="2"/>
  <line x1="150" y1="160" x2="250" y2="160" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="140" y="220" font-family="Arial, sans-serif" font-size="11" fill="#000">No</text>
  
  <!-- Yes -->
  <line x1="350" y1="320" x2="350" y2="360" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="365" y="345" font-family="Arial, sans-serif" font-size="11" fill="#000">Yes</text>
  
  <!-- Step 2: View Item Details -->
  <rect x="250" y="360" width="200" height="60" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="350" y="385" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">View Item Details</text>
  <text x="350" y="402" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Check price, description</text>
  <text x="350" y="415" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">View seller reputation</text>
  
  <!-- Arrow -->
  <line x1="350" y1="420" x2="350" y2="450" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Decision: Interested? -->
  <path d="M 350 450 L 450 500 L 350 550 L 250 500 Z" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="350" y="505" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000">Interested?</text>
  
  <!-- No - Back to browse -->
  <line x1="450" y1="500" x2="550" y2="500" stroke="#000" stroke-width="2"/>
  <line x1="550" y1="500" x2="550" y2="160" stroke="#000" stroke-width="2"/>
  <line x1="550" y1="160" x2="450" y2="160" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="560" y="330" font-family="Arial, sans-serif" font-size="11" fill="#000">No</text>
  
  <!-- Yes -->
  <line x1="350" y1="550" x2="350" y2="590" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="365" y="575" font-family="Arial, sans-serif" font-size="11" fill="#000">Yes</text>
  
  <!-- Step 3: Contact Seller -->
  <rect x="250" y="590" width="200" height="60" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="350" y="615" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">Contact Seller</text>
  <text x="350" y="632" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Send message via</text>
  <text x="350" y="645" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">messaging system</text>
  
  <!-- Arrow -->
  <line x1="350" y1="650" x2="350" y2="680" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4: Message Exchange -->
  <rect x="250" y="680" width="200" height="60" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="350" y="705" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">Message Exchange</text>
  <text x="350" y="722" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Negotiate price</text>
  <text x="350" y="735" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Arrange meeting time/place</text>
  
  <!-- Arrow -->
  <line x1="350" y1="740" x2="350" y2="770" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Decision: Agreement Reached? -->
  <path d="M 350 770 L 450 810 L 350 850 L 250 810 Z" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="350" y="810" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">Agreement</text>
  <text x="350" y="823" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">Reached?</text>
  
  <!-- No - End -->
  <line x1="250" y1="810" x2="100" y2="810" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="170" y="805" font-family="Arial, sans-serif" font-size="11" fill="#000">No</text>
  
  <ellipse cx="60" cy="810" rx="50" ry="25" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="60" y="818" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000">END</text>
  
  <!-- Yes - Continue -->
  <line x1="450" y1="810" x2="550" y2="810" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="485" y="805" font-family="Arial, sans-serif" font-size="11" fill="#000">Yes</text>
  
  <!-- Step 5: Meet & Transaction -->
  <rect x="500" y="780" width="170" height="60" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="585" y="805" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">Meet in Person</text>
  <text x="585" y="822" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Exchange item</text>
  <text x="585" y="835" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Complete payment</text>
  
  <!-- Arrow -->
  <line x1="585" y1="780" x2="585" y2="740" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 6: Mark as Sold -->
  <rect x="500" y="680" width="170" height="50" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="585" y="702" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">Seller Marks Sold</text>
  <text x="585" y="720" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Update item status</text>
  
  <!-- Arrow -->
  <line x1="585" y1="680" x2="585" y2="640" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Success End -->
  <ellipse cx="585" cy="610" rx="60" ry="25" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="585" y="618" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">SUCCESS</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#000"/>
    </marker>
  </defs>
  
  <!-- Notes -->
  <text x="350" y="885" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">
    Note: Users can add items to favorites at any point during browsing
  </text>
</svg>
