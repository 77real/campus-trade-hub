<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300">
  <!-- Pure white background -->
  <rect width="1000" height="300" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="500" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#000">
    Deployment Pipeline
  </text>
  
  <!-- Pipeline stages -->
  <!-- Stage 1: GitHub Repository -->
  <rect x="50" y="80" width="120" height="60" fill="none" stroke="#000" stroke-width="2" rx="5"/>
  <text x="110" y="105" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000">GitHub</text>
  <text x="110" y="122" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">Repository</text>
  
  <!-- Arrow 1 -->
  <line x1="170" y1="110" x2="210" y2="110" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 2: Heroku Git -->
  <rect x="210" y="80" width="120" height="60" fill="none" stroke="#000" stroke-width="2" rx="5"/>
  <text x="270" y="105" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000">Heroku</text>
  <text x="270" y="122" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">Git</text>
  
  <!-- Arrow 2 -->
  <line x1="330" y1="110" x2="370" y2="110" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 3: Buildpack Detection -->
  <rect x="370" y="80" width="120" height="60" fill="none" stroke="#000" stroke-width="2" rx="5"/>
  <text x="430" y="105" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000">Buildpack</text>
  <text x="430" y="122" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">Detection</text>
  
  <!-- Arrow 3 -->
  <line x1="490" y1="110" x2="50" y2="110" stroke="#000" stroke-width="0"/>
  <path d="M 490 110 L 500 110 Q 520 110 520 130 L 520 190 Q 520 210 500 210 L 90 210 Q 70 210 70 190 L 70 160" 
        stroke="#000" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 4: Compilation -->
  <rect x="50" y="160" width="120" height="60" fill="none" stroke="#000" stroke-width="2" rx="5"/>
  <text x="110" y="195" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000">Compilation</text>
  
  <!-- Arrow 4 -->
  <line x1="170" y1="190" x2="210" y2="190" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 5: Slug Creation -->
  <rect x="210" y="160" width="120" height="60" fill="none" stroke="#000" stroke-width="2" rx="5"/>
  <text x="270" y="185" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000">Slug</text>
  <text x="270" y="202" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">Creation</text>
  
  <!-- Arrow 5 -->
  <line x1="330" y1="190" x2="370" y2="190" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 6: Dyno Deployment -->
  <rect x="370" y="160" width="120" height="60" fill="none" stroke="#000" stroke-width="2" rx="5"/>
  <text x="430" y="185" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000">Dyno</text>
  <text x="430" y="202" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">Deployment</text>
  
  <!-- Arrow 6 -->
  <line x1="490" y1="190" x2="530" y2="190" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Stage 7: Application Running -->
  <rect x="530" y="160" width="140" height="60" fill="none" stroke="#000" stroke-width="2" rx="5"/>
  <text x="600" y="185" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#000">Application</text>
  <text x="600" y="202" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">Running</text>
  
  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#000"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <text x="50" y="270" font-family="Arial, sans-serif" font-size="10" fill="#666">
    Automated deployment flow from code push to live application
  </text>
</svg>
