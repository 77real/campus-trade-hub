<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- White Background -->
  <rect width="800" height="600" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#000">
    JWT Authentication Flow
  </text>
  
  <!-- User/Browser Column -->
  <text x="100" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">
    User / Browser
  </text>
  <line x1="100" y1="80" x2="100" y2="560" stroke="#000" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- React Frontend Column -->
  <text x="300" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">
    React Frontend
  </text>
  <line x1="300" y1="80" x2="300" y2="560" stroke="#000" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Spring Backend Column -->
  <text x="500" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">
    Spring Boot Backend
  </text>
  <line x1="500" y1="80" x2="500" y2="560" stroke="#000" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Database Column -->
  <text x="700" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">
    MySQL Database
  </text>
  <line x1="700" y1="80" x2="700" y2="560" stroke="#000" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Step 1: User enters credentials -->
  <rect x="25" y="100" width="150" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="100" y="118" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">1. Enter email</text>
  <text x="100" y="132" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">and password</text>
  
  <!-- Arrow to Frontend -->
  <line x1="175" y1="120" x2="225" y2="120" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: POST /api/auth/login -->
  <rect x="225" y="100" width="150" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="300" y="118" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">2. POST</text>
  <text x="300" y="132" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">/api/auth/login</text>
  
  <!-- Arrow to Backend -->
  <line x1="375" y1="120" x2="425" y2="150" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="390" y="130" font-family="Arial, sans-serif" font-size="10" fill="#666">HTTPS</text>
  
  <!-- Step 3: Validate credentials -->
  <rect x="425" y="150" width="150" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="500" y="168" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">3. Validate</text>
  <text x="500" y="182" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">credentials</text>
  
  <!-- Arrow to Database -->
  <line x1="575" y1="170" x2="625" y2="170" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4: Query user -->
  <rect x="625" y="150" width="150" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="700" y="165" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">4. SELECT * FROM users</text>
  <text x="700" y="180" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#000">WHERE email = ?</text>
  
  <!-- Arrow back to Backend -->
  <line x1="625" y1="210" x2="575" y2="210" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="595" y="205" font-family="Arial, sans-serif" font-size="10" fill="#666">User data</text>
  
  <!-- Step 5: BCrypt verify -->
  <rect x="425" y="220" width="150" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="500" y="238" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">5. BCrypt.verify()</text>
  <text x="500" y="252" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">password hash</text>
  
  <!-- Decision diamond -->
  <path d="M 500 280 L 550 310 L 500 340 L 450 310 Z" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="500" y="315" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">Valid?</text>
  
  <!-- Invalid path -->
  <line x1="450" y1="310" x2="375" y2="310" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="410" y="305" font-family="Arial, sans-serif" font-size="10" fill="#000">No</text>
  
  <rect x="225" y="290" width="150" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="300" y="308" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">Return 401</text>
  <text x="300" y="322" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">Unauthorized</text>
  
  <line x1="225" y1="310" x2="175" y2="310" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="25" y="290" width="150" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="100" y="308" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">Show error:</text>
  <text x="100" y="322" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">"Invalid credentials"</text>
  
  <!-- Valid path -->
  <line x1="500" y1="340" x2="500" y2="370" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="515" y="360" font-family="Arial, sans-serif" font-size="10" fill="#000">Yes</text>
  
  <!-- Step 6: Generate JWT -->
  <rect x="425" y="370" width="150" height="50" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="500" y="390" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">6. Generate JWT</text>
  <text x="500" y="405" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Payload: userId, email, role</text>
  <text x="500" y="417" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Expiry: 24h</text>
  
  <!-- Arrow to Frontend -->
  <line x1="425" y1="395" x2="375" y2="425" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 7: Return token -->
  <rect x="225" y="425" width="150" height="50" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="300" y="445" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">7. Return 200 OK</text>
  <text x="300" y="460" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">{token, userId, role}</text>
  
  <!-- Arrow to User -->
  <line x1="225" y1="450" x2="175" y2="450" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 8: Store token -->
  <rect x="25" y="430" width="150" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="100" y="448" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">8. Store in</text>
  <text x="100" y="462" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">localStorage</text>
  
  <!-- Separator -->
  <line x1="20" y1="490" x2="780" y2="490" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="400" y="505" font-family="Arial, sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#666">
    Subsequent Authenticated Requests
  </text>
  
  <!-- Step 9: API request with token -->
  <line x1="100" y1="520" x2="300" y2="520" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="200" y="515" font-family="Arial, sans-serif" font-size="10" fill="#000">9. API Request</text>
  
  <line x1="300" y1="520" x2="500" y2="520" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="515" font-family="Arial, sans-serif" font-size="10" fill="#000">Header: Authorization: Bearer {token}</text>
  
  <!-- Step 10: JWT Filter validates -->
  <rect x="425" y="530" width="150" height="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="500" y="550" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">10. JWT Filter validates token</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#000"/>
    </marker>
  </defs>
  
  <!-- Notes -->
  <text x="400" y="585" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">
    Security: Passwords hashed with BCrypt | JWT signed with secret key | HTTPS for transmission
  </text>
</svg>
