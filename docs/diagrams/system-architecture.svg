<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- White Background -->
  <rect width="800" height="600" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#000">
    Campus Trade Hub - System Architecture
  </text>
  
  <!-- Client Layer -->
  <rect x="50" y="60" width="700" height="80" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="400" y="85" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">
    Client Layer
  </text>
  <rect x="100" y="95" width="150" height="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="175" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000">Web Browser</text>
  
  <rect x="280" y="95" width="150" height="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="355" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000">React 18 + Vite</text>
  
  <rect x="460" y="95" width="150" height="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="535" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000">TailwindCSS UI</text>
  
  <!-- Arrow -->
  <line x1="400" y1="140" x2="400" y2="170" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="420" y="160" font-family="Arial, sans-serif" font-size="11" fill="#000">HTTPS/REST API</text>
  
  <!-- Application Layer -->
  <rect x="50" y="170" width="700" height="120" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="400" y="195" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">
    Application Layer
  </text>
  
  <rect x="80" y="205" width="140" height="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="150" y="225" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">Spring Boot 3.2</text>
  
  <rect x="240" y="205" width="140" height="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="310" y="225" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">Spring Security</text>
  
  <rect x="400" y="205" width="140" height="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="470" y="225" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">JWT Authentication</text>
  
  <rect x="560" y="205" width="140" height="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="630" y="225" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">REST Controllers</text>
  
  <rect x="160" y="245" width="140" height="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="230" y="265" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">Business Logic</text>
  
  <rect x="320" y="245" width="140" height="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="390" y="265" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">Spring Data JPA</text>
  
  <rect x="480" y="245" width="140" height="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="550" y="265" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">Repository Layer</text>
  
  <!-- Arrow -->
  <line x1="400" y1="290" x2="400" y2="320" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="420" y="310" font-family="Arial, sans-serif" font-size="11" fill="#000">JDBC/SQL</text>
  
  <!-- Data Layer -->
  <rect x="50" y="320" width="700" height="100" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="400" y="345" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">
    Data Layer
  </text>
  
  <rect x="150" y="355" width="160" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="230" y="375" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000">MySQL Database</text>
  <text x="230" y="390" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Relational Data</text>
  
  <rect x="340" y="355" width="160" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="420" y="375" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000">H2 Database</text>
  <text x="420" y="390" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Development/Testing</text>
  
  <rect x="530" y="355" width="160" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="610" y="375" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000">Redis Cache</text>
  <text x="610" y="390" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">(Future Enhancement)</text>
  
  <!-- External Services -->
  <rect x="50" y="440" width="700" height="120" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="400" y="465" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">
    External Services (Optional)
  </text>
  
  <rect x="100" y="475" width="130" height="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="165" y="495" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">Cloudinary (Images)</text>
  
  <rect x="250" y="475" width="130" height="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="315" y="495" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">SendGrid (Email)</text>
  
  <rect x="400" y="475" width="130" height="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="465" y="495" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">New Relic (APM)</text>
  
  <rect x="550" y="475" width="130" height="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="615" y="495" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">Papertrail (Logs)</text>
  
  <rect x="175" y="515" width="130" height="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="240" y="535" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">GitHub (Repo)</text>
  
  <rect x="325" y="515" width="150" height="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="400" y="535" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">Heroku (Hosting)</text>
  
  <rect x="495" y="515" width="130" height="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="560" y="535" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000">Cloudflare (CDN)</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#000"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <text x="50" y="585" font-family="Arial, sans-serif" font-size="10" fill="#666">
    Note: Dashed boxes indicate optional/future components
  </text>
</svg>
